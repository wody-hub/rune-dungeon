project:
  name: rune-dungeon

server:
  frontend:
    port: 5173
    baseUrl: http://127.0.0.1:5173
  backend: null

auth:
  type: none

frontend:
  root: client
  framework: svelte
  routes:
    main: /
  pages:
    root: src

database: null
dummyData:
  enabled: false

browser:
  runner: direct-playwright
  viewport:
    width: 1280
    height: 720
  chromeArgs:
    - --use-angle=swiftshader
    - --enable-webgl
    - --ignore-gpu-blocklist

outputs:
  root: .si-planning
  featureDirPattern: "{feature}"
  qaChecklist: qa-checklist.md
  qaReport: qa-report.md
  finalReport: final-report.md
